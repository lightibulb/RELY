function bb(){const W=$('#p0').clientWidth||328,N=Math.min(100,Math.floor((W+2)/4)),r=rng(tr.seed+5);
const s=[...Array(N)].map((_,i)=>{const b=Math.floor(i/N*tr.bars),e=[.3,.55,.75,.95][(b>>3)%4]*(.6+.4*r());return `<i style="height:${2*Math.max(4,Math.round(e*26))}px"></i>`}).join('');
BW=N*4-2;$('#pg').style.width=BW+'px';$('#b0').innerHTML=s;b1.innerHTML=s}
function pt(sec){const p=Math.min(1,sec/dur);b1.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;thm.style.transform=`translateX(${p*BW}px)`;mpf.style.transform=`scaleX(${p})`;const s=sec|0;if(s!=shown){shown=s;elt.textContent=fm(s);$('#rm').textContent=fm(Math.round(dur))}}
const rt=e=>{const r=B.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};
B.onpointerdown=e=>{dr=1;B.setPointerCapture(e.pointerId);B.classList.add('d');pv=rt(e);pt(pv*dur)};
B.onpointermove=e=>{if(dr){pv=rt(e);pt(pv*dur)}};
B.onpointerup=B.onpointercancel=()=>{if(dr){dr=0;B.classList.remove('d');sk(pv*dur)}};
(function loop(){if(!dr)pt(ps());requestAnimationFrame(loop)})();
/* views */
let V='h',mood='All';
const row=t=>`<button class="row px${t.id==cur?' cur':''}" data-id="${t.id}">${im(t,48)}<span class="t"><b>${t.t}</b><span>${t.a}</span></span><em>${du(t)}</em><span class="eq"><i></i><i></i><i></i></span></button>`;
const list=ids=>`<div class="list" data-ids="${ids}">${ids.map(i=>row(T[i])).join('')}</div>`;
const alb=()=>[...new Set(T.map(t=>t.al))];
const card=a=>{const ts=T.filter(t=>t.al==a);return `<button class="card" data-al="${ts.map(t=>t.id)}">${im(ts[0],144)}<b>${a}</b><span>${ts[0].a}</span></button>`};
function vh(){const h=new Date().getHours(),ids=T.filter(t=>mood=='All'||t.m==mood).map(t=>t.id);
return `<h1>${h<5?'Still up?':h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</h1><div class="chips">${['All',...MO].map(m=>`<button class="chip px${m==mood?' on':''}" data-m="${m}">${m}</button>`).join('')}</div><button class="hero px" data-mix><span class="t"><b>RELY mix</b><span>${T.length} chiptunes, shuffled</span></span><span class="pp px">${ic('play',3)}</span></button><h2>Quick picks</h2>${list(ids)}<h2>Albums for you</h2><div class="hs">${alb().map(card).join('')}</div>`}
const vs=()=>`<h1>Explore</h1><input id="sq" class="sb px" placeholder="Search songs, artists, moods" autocomplete="off"><div id="res"></div>`;
function rs(v){const x=v.trim().toLowerCase(),ts=x?T.filter(t=>(t.t+t.a+t.al+t.m).toLowerCase().includes(x)):0;
$('#res').innerHTML=ts?(ts.length?list(ts.map(t=>t.id)):'<p class="em">No matches. Try an artist or a mood.</p>'):`<h2>Browse by mood</h2><div class="tiles">${MO.map(m=>`<button class="tile px" data-mo="${m}">${m}${im(T.find(t=>t.m==m),72)}</button>`).join('')}</div>`}
function vl(){const ids=T.filter(t=>L.has(t.id)).map(t=>t.id);return `<h1>Library</h1><h2>Liked songs (${ids.length})</h2>${ids.length?list(ids):'<p class="em">Tap the heart on a song to keep it here.</p>'}<h2>All albums</h2><div class="hs">${alb().map(card).join('')}</div>`}
function rn(){const m=$('#main'),y=m.scrollTop;m.innerHTML=V=='h'?vh():V=='s'?vs():vl();if(V=='s'){rs('');$('#sq').oninput=e=>rs(e.target.value)}else m.scrollTop=y;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
const rq=()=>{$('#ql').innerHTML=list(q)};
function ui(){const t=tr;$('#mi').src=art(t,48);$('#cv').src=art(t,288);$('#mt').textContent=$('#nt').textContent=t.t;$('#ma').textContent=t.a;$('#na').textContent=t.a+', '+t.al;
$('#lk').innerHTML=ic(L.has(cur)?'heart':'heartO',3);shown=-1;bb();pt(ps());rq();document.querySelectorAll('.row').forEach(r=>r.classList.toggle('cur',+r.dataset.id==cur))}
/* theme */
const dk=()=>R.dataset.theme?R.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const bar=()=>{try{window.Android&&Android.bar(dk())}catch(e){}};
function thm2(){const v=dk()?'light':'dark';R.dataset.theme=v;try{localStorage.setItem('rely-th',v)}catch(e){}bar()}
matchMedia('(prefers-color-scheme:dark)').onchange=bar;
window.relyBack=()=>{const n=$('#np');if(n.classList.contains('open')){n.classList.remove('open');return true}return false};
try{const s=localStorage.getItem('rely-th');if(s)R.dataset.theme=s}catch(e){}
/* wiring */
const A={tb:thm2,mp:tg,pp:tg,pv:prv,nx:()=>nxt(0),sh:tsh,rp:trp,lk:lk,cl:()=>$('#np').classList.remove('open'),mini:()=>$('#np').classList.add('open')};
document.addEventListener('click',e=>{const c=e.target.closest('button,#mini');if(!c)return;const d=c.dataset;
if(c.classList.contains('row')){const ids=c.parentElement.dataset.ids.split(',').map(Number);pq(ids,ids.indexOf(+d.id))}
else if(d.al!=null)pq(d.al.split(',').map(Number),0)
else if(d.mo)pq(T.filter(t=>t.m==d.mo).map(t=>t.id),0)
else if('mix' in d){sh=1;$('#sh').classList.add('on');pq(T.map(t=>t.id),Math.floor(Math.random()*T.length))}
else if(d.m){mood=d.m;rn()}
else if(d.v){V=d.v;rn()}
else if(d.t!=null){$('#np').dataset.tab=d.t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===c))}
else A[c.id]?.()});
addEventListener('keydown',e=>{if(e.target.closest('input,button'))return;if(e.code=='Space'){e.preventDefault();tg()}else if(e.code=='ArrowRight')sk(Math.min(dur-1,ps()+5));else if(e.code=='ArrowLeft')sk(Math.max(0,ps()-5));else if(e.code=='KeyN')nxt(0)});
addEventListener('resize',()=>{bb();pt(ps())});
$('nav').innerHTML=[['h','home','Home'],['s','search','Explore'],['l','lib','Library']].map(([v,i,l])=>`<button data-v="${v}"><span class="ind px">${ic(i,3)}</span>${l}</button>`).join('');
$('#tb').innerHTML=ic('half',2);$('#cl').innerHTML=ic('chev',2);$('#pv').innerHTML=ic('prev',3);$('#nx').innerHTML=ic('next',3);
go(0,0,0);rn();bar();

    /* ── Android bridge helpers (injected by rely-build.sh) ── */
    window.pickTrack = function() {
      if (window.Android) Android.pickAudioFile();
    };

    window.onFilePicked = function(uri, name) {
      var title = name.replace(/\.[^.]+$/, "");
      if (window.Android) Android.play(uri, title, "RELY");
      if (typeof loadTrack === "function") loadTrack({ uri: uri, title: title, artist: "RELY" });
    };

    /* Keep screen awake when Now Playing opens */
    var npSection = document.getElementById("np");
    if (npSection) {
      var obs = new MutationObserver(function() {
        var open = npSection.classList.contains("open") || npSection.dataset.tab === "1";
        if (window.Android) Android.keepScreenOn(open);
      });
      obs.observe(npSection, { attributes: true, attributeFilter: ["class","data-tab"] });
    }
