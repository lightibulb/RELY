plugins { id 'com.android.application' }

android {
    namespace 'com.rely.player'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rely.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable without your own keystore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
